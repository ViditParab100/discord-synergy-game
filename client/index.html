<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synergy Auto-Battler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        
        <header class="top-bar" style="justify-content: center; position: relative;">
            <div class="round-info">
                <span class="score">P1</span>
                <span class="timer" style="margin: 0 20px; color: #aaa;">Round 1</span>
                <span class="score enemy">P2</span>
            </div>
            
            <button id="start-fight-btn" style="position: absolute; right: 20px; background: #ff4757; color: white; border: none; padding: 8px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                ⚔️ FIGHT!
            </button>
        </header>

        <aside class="side-panel left-panel">
            <div class="player-profile">
                <img src="placeholder-avatar.png" alt="P1" class="avatar">
                <h3>NeonVader (You)</h3>
                <div class="health-bar"><div class="health-fill" style="width: 100%;">100</div></div>
            </div>
            
            <div class="p1-synergies" style="margin-bottom: 15px; font-size: 0.9em; color: #4dabf7;">
                </div>
            
            <hr style="border-color: #333; margin-bottom: 15px;">
            
            <div class="p1-unit-list" style="font-size: 0.85em; color: #ccc; display: flex; flex-direction: column; gap: 5px;">
                <p style="color:#666;">No units deployed.</p>
            </div>
        </aside>

        <main class="board-container" id="phaser-game-canvas"></main>

        <aside class="side-panel right-panel">
             <div class="player-profile">
                <img src="placeholder-avatar2.png" alt="P2" class="avatar">
                <h3>Enemy Player</h3>
                <div class="health-bar"><div class="health-fill enemy" style="width: 100%;">100</div></div>
            </div>
            
            <div class="p2-synergies" style="margin-bottom: 15px; font-size: 0.9em; color: #ff6b6b;">
                <p style="color:#666;">Waiting for opponent...</p>
            </div>
            
            <hr style="border-color: #333; margin-bottom: 15px;">
            
            <div class="p2-unit-list" style="font-size: 0.85em; color: #ccc; display: flex; flex-direction: column; gap: 5px;">
                 <p style="color:#666;">No units deployed.</p>
            </div>
        </aside>

        <footer class="shop-container">
            <div class="shop-header">
                <span>Shop</span>
                <button class="refresh-btn">🔄 Refresh (2g)</button>
            </div>
            <div class="shop-cards">
                <div class="card coder-theme"><p>Star_Vader</p><p>3g</p></div>
                <div class="card trader-theme"><p>RockStarDad</p><p>2g</p></div>
                <div class="card killer-theme"><p>Binkly</p><p>4g</p></div>
                <div class="card empty-slot"></div>
                <div class="card empty-slot"></div>
            </div>
        </footer>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="../shared/dictionary.js"></script>
    <script src="../shared/gameState.js"></script>
    <script src="../shared/coords.js"></script>
    <script src="game.js"></script>
</body>
</html>
